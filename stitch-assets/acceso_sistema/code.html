<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DevTrace - Acceso al Sistema</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config injected from Style Guidance -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#1b6489",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e0e3e5",
                    "secondary": "#45636d",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#2d4b55",
                    "tertiary-container": "#a9000f",
                    "tertiary": "#7d0008",
                    "on-surface": "#191c1e",
                    "inverse-surface": "#2d3133",
                    "tertiary-fixed": "#ffdad6",
                    "on-surface-variant": "#40484e",
                    "on-secondary-fixed": "#001f28",
                    "tertiary-fixed-dim": "#ffb4ab",
                    "on-tertiary-container": "#ffb3aa",
                    "surface-container-low": "#f2f4f6",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "primary": "#00405b",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#8fcef7",
                    "outline": "#70787e",
                    "on-secondary-container": "#4b6973",
                    "surface-bright": "#f7f9fb",
                    "on-tertiary-fixed-variant": "#93000b",
                    "on-primary-fixed-variant": "#004c6c",
                    "on-primary-container": "#8fcdf6",
                    "primary-container": "#00587c",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#410002",
                    "primary-fixed-dim": "#8fcef7",
                    "primary-fixed": "#c7e7ff",
                    "surface-container-lowest": "#ffffff",
                    "background": "#f7f9fb",
                    "surface-container": "#eceef0",
                    "secondary-fixed-dim": "#accbd8",
                    "on-background": "#191c1e",
                    "secondary-fixed": "#c8e8f4",
                    "on-error": "#ffffff",
                    "surface": "#f7f9fb",
                    "outline-variant": "#c0c7cf",
                    "on-primary-fixed": "#001e2e",
                    "secondary-container": "#c8e8f4",
                    "inverse-on-surface": "#eff1f3",
                    "surface-dim": "#d8dadc",
                    "surface-container-high": "#e6e8ea"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "xs": "4px",
                    "xl": "40px",
                    "sm": "8px",
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "base": "4px",
                    "md": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "code-data": ["Geist"],
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-md": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {

                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "code-data": ["13px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400"}]
            }
          }
        }
      }

<style>
        /* Tech Pattern Background */
        .tech-pattern {
            background-color: #f7f9fb;
            background-image: 
                linear-gradient(#e0e3e5 1px, transparent 1px),
                linear-gradient(90deg, #e0e3e5 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center center;
        }
        
        .glass-accent {
            background: radial-gradient(circle at 50% -20%, rgba(143, 206, 247, 0.15), transparent 60%);
        }

        /* Material Icon Helper */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="tech-pattern min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden text-on-surface">
<!-- Ambient glowing orbs behind the card for depth -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-secondary-fixed/40 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-primary-fixed/40 rounded-full mix-blend-multiply filter blur-[100px] opacity-60 animate-pulse" style="animation-duration: 10s;"></div>
<!-- Login Container (Surface Level 1) -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_-2px_rgba(0,88,124,0.08)] relative z-10 border border-outline-variant/30 overflow-hidden transform transition-all hover:shadow-[0_8px_30px_-4px_rgba(0,88,124,0.12)]">
<!-- Glassmorphic Header Accent -->
<div class="absolute top-0 inset-x-0 h-32 glass-accent pointer-events-none"></div>
<div class="p-lg md:p-xl relative">
<!-- Brand / Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary-container text-on-primary rounded-xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-4xl icon-fill" data-icon="polyline">polyline</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">DevTrace</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">Enter your credentials to access the secure environment.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface block uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-secondary-fixed/30 transition-all duration-200" id="email" name="email" placeholder="admin@devtrace.io" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps text-on-surface block uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-11 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-secondary-fixed/30 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary-container focus:ring-primary-container focus:ring-offset-surface-container-lowest bg-surface cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-3 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember this device
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center gap-2 py-3 px-4 border border-transparent rounded-full shadow-sm text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all duration-200 font-body-md text-body-md group font-medium" type="submit">
<span>Sign in to Workspace</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer / Meta Links -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-code-data text-code-data text-outline">
                    Secure Session • SSO Enabled
                </p>
</div>
</div>
</main>
</body></html>
